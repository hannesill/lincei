  </svg>
  <text x="320" y="104" fill="#1A1A1A" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag Lincei into Applications.</text>
  <path d="M274 204H356" stroke="#1A1A1A" stroke-width="4"/>
