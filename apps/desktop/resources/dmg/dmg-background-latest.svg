  <!-- First launch of an app without a Developer ID: the steps are in README.md, under Install. -->
  <rect x="62" y="314" width="520" height="76" fill="#1A1A1A"/>
  <rect x="58" y="310" width="520" height="76" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="76" y="332" fill="#1A1A1A" font-family="Helvetica" font-size="12" font-weight="700">macOS blocks the first launch of each download. To allow it:</text>
  <text x="76" y="352" fill="#1A1A1A" font-family="Helvetica" font-size="12" font-weight="400">1. Open Lincei from Applications. When macOS refuses, choose Done, not Move to Trash.</text>
  <text x="76" y="371" fill="#1A1A1A" font-family="Helvetica" font-size="12" font-weight="400">2. System Settings → Privacy &amp; Security → Open Anyway, then your Mac password.</text>
